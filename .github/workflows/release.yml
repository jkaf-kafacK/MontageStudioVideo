# Publie une version quand on pousse une étiquette comme v1.2.0 :
#   git tag v1.2.0
#   git push origin v1.2.0
# Produit : l'installateur Windows (MontageStudioVideo-<version>-Setup.exe) + le ZIP du code.
name: Publier une version

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Version de uv figée (publiée depuis plus de 2 semaines) et son empreinte SHA-256 vérifiée.
  UV_VERSION: "0.12.21"
  UV_WIN_SHA256: "5d223efa0bf00208c3853246af09420419dfbd352536aa6bb8163d6170e23890"

jobs:
  verification:
    name: Vérifications avant publication (audit + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: montage_studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Aucune faille connue dans les versions livrées
        run: |
          python -m pip install -q pip-audit
          pip-audit -r requirements.lock --no-deps --disable-pip

      - name: Tests avec les versions exactes livrées
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -q --no-deps -r requirements.lock
          python -m pip install -q pytest
          python -m pytest tests -q

  zip:
    name: ZIP du code
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fabriquer le ZIP de l'application
        run: |
          echo "${GITHUB_REF_NAME#v}" > VERSION
          git archive --format=zip --prefix=montage_studio/ --add-file=VERSION \
            -o "montage_studio-${GITHUB_REF_NAME}.zip" "HEAD:montage_studio"

      - name: Créer la version sur GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: montage_studio-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ## Installation sous Windows (recommandé)
            1. Télécharger **`MontageStudioVideo-${{ github.ref_name }}-Setup.exe`** ci-dessous (la ligne apparaît quelques minutes après la publication).
            2. Double-cliquer. Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*.
            3. Au premier lancement, Python et les composants sont téléchargés automatiquement (une seule fois, connexion Internet nécessaire).

            Tes vidéos, médias et projets sont rangés dans **Documents\Montage Studio Video**.

            ## Installation manuelle (macOS / Linux / développeurs)
            Télécharger le ZIP, installer [Python 3.12](https://www.python.org/downloads/), puis lancer `lancer_mac_linux.sh` (ou `lancer_windows.bat`).

  windows:
    name: Installateur Windows
    needs: zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Numéro de version
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart("v")
          Set-Content -Path montage_studio\VERSION -Value $v -NoNewline -Encoding utf8NoBOM
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Télécharger uv et vérifier son empreinte
        shell: pwsh
        run: |
          $url = "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $url -OutFile uv.zip
          $hash = (Get-FileHash uv.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:UV_WIN_SHA256) { throw "Empreinte de uv invalide : $hash" }
          Expand-Archive uv.zip -DestinationPath uvtmp
          Copy-Item uvtmp\uv.exe installer\uv.exe

      - name: Compiler l'installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\MontageStudioVideo.iss
          if ($LASTEXITCODE -ne 0) { throw "Échec de la compilation de l'installateur" }

      - name: Ajouter l'installateur à la version
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/MontageStudioVideo-*-Setup.exe
